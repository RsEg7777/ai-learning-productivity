name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_LOCAL_MODELS: 'true'
      PYTHON_VERSION: '3.12'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Scan source for disallowed model providers
        run: |
          echo "Checking for non-AWS model provider references in src/"
          if grep -R --line-number -E "(openai|cohere|replicate|huggingface|transformers|bard)" src; then
            echo "Disallowed third-party model provider references found. Use Bedrock/ModelRouter instead."
            exit 1
          else
            echo "No disallowed providers found in src/."
          fi

      - name: Run tests
        run: pytest -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
