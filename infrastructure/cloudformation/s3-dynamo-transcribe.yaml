AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Creates an S3 bucket for content, a DynamoDB table for metadata, and an IAM
  role that grants AWS Transcribe permission to access the S3 bucket and write
  logs. Parameterize names so you can deploy per-environment.

Parameters:
  BucketName:
    Type: String
    Description: S3 bucket name for uploads (must be globally unique)

  DynamoTableName:
    Type: String
    Default: content-table
    Description: DynamoDB table name for content metadata

Resources:
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

  ContentDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoTableName
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  TranscribeAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketName}-transcribe-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - transcribe.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: TranscribeS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}'
                  - !Sub 'arn:aws:s3:::${BucketName}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

Outputs:
  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref ContentBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  DynamoTableName:
    Description: Name of the DynamoDB table
    Value: !Ref ContentDynamoTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoTableName'

  TranscribeRoleArn:
    Description: ARN of the Transcribe access role
    Value: !GetAtt TranscribeAccessRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TranscribeRoleArn'
