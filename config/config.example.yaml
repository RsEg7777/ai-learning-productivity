# AI Learning Assistant Configuration
# Copy this file to config.yaml and update with your values

# Environment
environment: dev  # dev, staging, prod

# AWS Configuration
aws:
  region: us-east-1
  account_id: "YOUR_AWS_ACCOUNT_ID"
  
  # S3
  content_bucket: ai-learning-assistant-content-dev
  
  # DynamoDB Tables
  user_progress_table: ai-learning-assistant-user-progress-dev
  quiz_results_table: ai-learning-assistant-quiz-results-dev
  flashcards_table: ai-learning-assistant-flashcards-dev
  content_metadata_table: ai-learning-assistant-content-metadata-dev
  
  # Cognito
  user_pool_id: YOUR_USER_POOL_ID
  user_pool_client_id: YOUR_CLIENT_ID
  
  # Bedrock
  bedrock:
    default_model: anthropic.claude-v2
    max_tokens: 2048
    temperature: 0.7
  
  # Transcribe
  transcribe:
    default_language: en-US
    media_format: mp4
  
  # Polly
  polly:
    default_voice: Joanna
    output_format: mp3
    engine: neural
  
  # Translate
  translate:
    preserve_technical_terms: true

# Application Settings
app:
  # Content Processing
  content_processing:
    max_text_size_mb: 10
    max_pdf_size_mb: 50
    max_video_size_mb: 500
    max_audio_size_mb: 100
    text_timeout_seconds: 30
    video_timeout_seconds: 300
  
  # Quiz Generation
  quiz:
    min_flashcards: 10
    default_passing_score: 70
    spaced_repetition_enabled: true
  
  # Code Analysis
  code_analysis:
    timeout_seconds: 15
    supported_languages:
      - python
      - javascript
      - typescript
      - java
      - cpp
      - csharp
      - go
      - rust
  
  # Multilingual Support
  languages:
    supported:
      - en
      - hi  # Hindi
      - ta  # Tamil
      - te  # Telugu
      - bn  # Bengali
      - mr  # Marathi
      - gu  # Gujarati
      - kn  # Kannada
      - ml  # Malayalam
      - pa  # Punjabi
      - or  # Odia
    default: en

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  json_logs: false
  log_group: /aws/lambda/ai-learning-assistant

# Security
security:
  encryption:
    algorithm: AES256
  mfa_enabled: true
  session_timeout_minutes: 60
  max_login_attempts: 5

# Performance
performance:
  api_rate_limit: 1000
  api_burst_limit: 2000
  lambda_timeout_seconds: 300
  lambda_memory_mb: 1024

# Feature Flags
features:
  voice_interface_enabled: true
  code_analysis_enabled: true
  multilingual_enabled: true
  spaced_repetition_enabled: true
